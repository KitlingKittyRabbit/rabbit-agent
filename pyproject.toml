[project]
name = "agent"
version = "0.1.0"
description = "自用 agent 软件"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "anthropic>=0.39",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "httpx2>=2.12",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
