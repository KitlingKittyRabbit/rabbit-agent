# agent 配置：角色 → provider 映射。api key 走环境变量，永不写入本文件。

[agent]
working_dir = "."          # 目标项目目录（工具沙箱根）
plan_mode = false          # plan 模式：全局只读
max_steps_main = 50        # 主 agent 步数上限
max_steps_executor = 30    # subagent 步数上限
session_db = ".agent_sessions.db"
compact_threshold_chars = 200000    # 主上下文压缩阈值（字符粗估），超过就把旧历史压成摘要
audit_log = ".agent_audit.log"      # 写操作/shell 审计日志（JSONL）
port = 8471                          # server 端口（8000 是开发热门端口，易撞车）

# 主 agent：顶尖模型（coding plan / 云端 API）
[main]
protocol = "anthropic"                       # anthropic | openai
base_url = "https://api.kimi.com/coding/"    # Kimi coding plan 端点，可按需替换
model = "kimi-for-coding"
api_key_env = "AGENT_MAIN_API_KEY"           # 从该环境变量读取 key

# 执行 subagent：本地小模型（Ollama）
[executor]
protocol = "openai"
base_url = "http://127.0.0.1:11434/v1"       # Ollama 的 OpenAI 兼容端点
model = "qwen3"                              # 按本地实际模型改
# api_key_env 不需要可不写（Ollama 不校验 key）
