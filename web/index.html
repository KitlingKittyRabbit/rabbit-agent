<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rabbit-agent</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app">
  <aside id="left">
    <div class="pane-title">项目 <button id="btn-new-project" title="添加项目">+</button></div>
    <div id="project-tree"></div>
  </aside>
  <div class="divider" id="div-left"></div>
  <main id="center">
    <header id="chat-header">
      <button id="collapse-left" title="收起/展开左栏">⟨</button>
      <span id="current-title">agent</span>
      <span id="turn-status"></span>
      <span class="spacer"></span>
      <label class="plan-area" title="plan 模式：开启后不会修改文件">
        <input type="checkbox" id="plan-toggle"> <span id="plan-label">plan：关</span>
      </label>
      <button id="btn-settings" title="设置">⚙</button>
      <button id="collapse-right" title="收起/展开右栏">⟩</button>
    </header>
    <div id="stream"></div>
    <div id="composer">
      <div class="composer-controls">
        <div class="menu-wrap">
          <button id="btn-model" class="chip" title="当前模型">模型 ▾</button>
        </div>
        <div class="menu-wrap">
          <button id="btn-effort" class="chip" title="思考强度">思考强度 ▾</button>
          <div id="effort-menu" class="menu hidden"></div>
        </div>
        <div id="ctx-ring-wrap" title="上下文占用">
          <svg id="ctx-ring" viewBox="0 0 36 36" width="30" height="30" aria-hidden="true">
            <circle class="ring-bg" cx="18" cy="18" r="15.9"></circle>
            <circle id="ring-fg" class="ring-fg" cx="18" cy="18" r="15.9"></circle>
          </svg>
          <span id="ctx-ring-text">?</span>
          <span id="ctx-badge" class="hidden">已压缩</span>
        </div>
        <span class="spacer"></span>
        <button id="btn-send" class="primary">发送</button>
        <button id="btn-stop">停止</button>
      </div>
      <textarea id="input" rows="2" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
    </div>
  </main>
  <div class="divider" id="div-right"></div>
  <aside id="right">
    <div class="tabs">
      <button class="tab active" data-tab="files">文件</button>
      <button class="tab" data-tab="tasks">任务</button>
    </div>
    <div id="tab-files" class="tab-page"></div>
    <div id="tab-tasks" class="tab-page hidden"></div>
  </aside>
</div>

<div id="modal-mask" class="hidden">
  <div id="modal">
    <h3>设置</h3>
    <div class="section-title">服务商 <span class="hint-inline">凭据全局共享，连一次两个角色都能用</span></div>
    <div id="provider-list"></div>
    <div id="m-result" class="hint"></div>
    <div class="section-title">角色模型</div>
    <div id="role-list"></div>
    <details id="advanced">
      <summary>高级</summary>
      <div class="hint">自定义端点（协议 / 地址 / 手填模型兜底）</div>
      <label>协议
        <select id="adv-protocol">
          <option value="openai">openai 兼容</option>
          <option value="anthropic">anthropic 兼容</option>
        </select>
      </label>
      <label>base_url <input id="adv-base-url" placeholder="留空 = 官方默认（需要 key）"></label>
      <label>API key <input id="adv-key" type="password" autocomplete="off"></label>
      <label>模型（可选，留空自动选）<input id="adv-model"></label>
      <div class="modal-buttons"><button id="adv-connect">连接自定义端点</button></div>
      <div class="hint" id="adv-result"></div>
      <hr class="sep">
      <div class="hint" id="cap-title">模型能力覆盖</div>
      <label>角色
        <select id="cap-role"><option value="main">main</option><option value="executor">executor</option></select>
      </label>
      <label>上下文窗口 <input id="cap-window" placeholder="留空 = 未知（不显示百分比）"></label>
      <label>推理状态
        <select id="cap-mode">
          <option value="unknown">未知</option>
          <option value="fixed">固定开启</option>
          <option value="none">不支持推理</option>
          <option value="adjustable">可调</option>
        </select>
      </label>
      <label>可调强度 <input id="cap-levels" placeholder="如 off,low,medium,high"></label>
      <label>最大输出 <input id="cap-max-output" placeholder="留空 = 未知"></label>
      <label>工具支持
        <select id="cap-tools"><option value="">未知</option><option value="yes">支持</option><option value="no">不支持</option></select>
      </label>
      <div class="hint" id="cap-source"></div>
      <div class="hint" id="cap-help">来源为用户设置时覆盖 provider 返回值；留空的字段表示未知。</div>
      <div class="modal-buttons"><button id="cap-save">保存能力</button><button id="cap-clear">清除覆盖</button></div>
    </details>
    <div class="modal-buttons"><button id="m-close">关闭</button></div>
    <div class="hint" id="m-usage"></div>
  </div>
</div>

<div id="key-modal-mask" class="hidden">
  <div id="key-modal">
    <div class="modal-head">
      <button id="key-back" title="返回">←</button>
      <h3 id="key-title">连接服务商</h3>
      <span class="spacer"></span>
      <button id="key-close" title="关闭">✕</button>
    </div>
    <p class="hint" id="key-desc"></p>
    <label id="key-row"><span>API 密钥</span>
      <input id="key-input" type="password" placeholder="API 密钥" autocomplete="off">
    </label>
    <div class="modal-buttons"><button id="key-submit" class="primary">继续</button></div>
    <div id="key-result"></div>
  </div>
</div>

<div id="model-modal-mask" class="hidden">
  <div id="model-modal">
    <div class="modal-head">
      <h3>选择模型</h3>
      <span class="spacer"></span>
      <button id="mm-refresh" title="从 provider 刷新模型列表">↻ 刷新</button>
      <button id="mm-close">关闭</button>
    </div>
    <input id="mm-search" placeholder="搜索模型 ID 或名称…" autocomplete="off">
    <div id="mm-error" class="fs-error hidden"></div>
    <div id="mm-groups"></div>
    <details id="mm-manual-box">
      <summary>手动输入模型（高级兜底）</summary>
      <div class="modal-foot">
        <select id="mm-manual-provider" title="手动输入所属 provider"></select>
        <input id="mm-manual" placeholder="手动输入模型 ID" autocomplete="off">
        <button id="mm-use-manual">使用</button>
      </div>
    </details>
  </div>
</div>

<div id="modal2-mask" class="hidden">
  <div id="modal2">
    <h3>添加项目</h3>
    <label>名字 <input id="p-name" placeholder="留空用目录名"></label>
    <label>路径 <input id="p-path" placeholder="点选下方目录，或直接输入"></label>
    <div id="dir-browser">
      <div id="dir-current"></div>
      <div id="dir-list"></div>
    </div>
    <div class="modal-buttons">
      <button id="p-pick">选这个目录</button>
      <button id="p-cancel">取消</button>
      <button id="p-ok" class="primary">添加</button>
    </div>
    <div id="p-result"></div>
  </div>
</div>

<script src="/marked.min.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
