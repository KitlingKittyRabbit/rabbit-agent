<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rabbit-agent</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/katex/katex.min.css">
</head>
<body>
<div id="app">
  <aside id="left">
    <div class="pane-title">项目 <button id="btn-new-project" title="添加项目">+</button></div>
    <div id="project-tree"></div>
  </aside>
  <div class="divider" id="div-left"></div>
  <main id="center">
    <header id="chat-header">
      <button id="collapse-left" title="收起/展开左栏">⟨</button>
      <span id="current-title">agent</span>
      <span id="turn-status"></span>
      <span class="spacer"></span>
      <button id="btn-settings" title="设置">⚙</button>
      <button id="collapse-right" title="收起/展开右栏">⟩</button>
    </header>
    <div id="stream"></div>
    <div id="composer">
      <div id="composer-box">
        <textarea id="input" rows="2" placeholder="随便问点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
        <div class="composer-controls">
          <div class="menu-wrap">
            <button id="btn-plan-mode" class="text-select" title="plan 模式">
              <span id="plan-label">Build</span><span class="caret" aria-hidden="true"></span>
            </button>
            <div id="plan-menu" class="menu hidden">
              <button class="menu-item" data-plan="off">Build · 直接执行</button>
              <button class="menu-item" data-plan="on">Plan · 只读规划</button>
            </div>
          </div>
          <div class="menu-wrap">
            <button id="btn-model" class="text-select" title="当前模型">
              <span class="provider-glyph" aria-hidden="true"></span>
              <span id="btn-model-label">未配置</span><span class="caret" aria-hidden="true"></span>
            </button>
          </div>
          <div class="menu-wrap hidden">
            <button id="btn-effort" class="text-select" title="思考强度">
              <span id="btn-effort-label">未知</span><span class="caret" aria-hidden="true"></span>
            </button>
            <div id="effort-menu" class="menu hidden"></div>
          </div>
          <div id="ctx-ring-wrap" class="hidden" title="上下文占用">
            <svg id="ctx-ring" viewBox="0 0 36 36" width="26" height="26" aria-hidden="true">
              <circle class="ring-bg" cx="18" cy="18" r="15.9"></circle>
              <circle id="ring-fg" class="ring-fg" cx="18" cy="18" r="15.9"></circle>
            </svg>
            <span id="ctx-ring-text">?</span>
            <span id="ctx-badge" class="hidden">已压缩</span>
          </div>
          <span class="spacer"></span>
          <button id="btn-send" class="round-send" title="发送" aria-label="发送">
            <svg class="icon-send" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 12.6V3.6M4.1 7.4 8 3.5l3.9 3.9"/></svg>
            <svg class="icon-stop hidden" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="4.4" y="4.4" width="7.2" height="7.2" rx="1.6" fill="currentColor"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>
  <div class="divider" id="div-right"></div>
  <aside id="right">
    <div class="tabs">
      <button class="tab active" data-tab="files">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h3l1.5 2h4.5A1.5 1.5 0 0 1 14 6.5v6A1.5 1.5 0 0 1 12.5 14h-9A1.5 1.5 0 0 1 2 12.5z"/></svg>
        文件
      </button>
      <button class="tab" data-tab="executor">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="12" height="9" rx="2.5"/><path d="M5.5 14h5M8 12.2V14"/></svg>
        执行者
      </button>
    </div>
    <div id="tab-files" class="tab-page"></div>
    <div id="tab-executor" class="tab-page hidden">
      <div id="exec-header">
        <span class="exec-label">执行者</span>
        <select id="exec-model" title="执行者使用的模型"></select>
        <select id="exec-effort" title="执行者的思考强度"></select>
        <button id="exec-report" class="text-select" title="执行者结果是否回报给指挥者">回报：开</button>
      </div>
      <div id="exec-timeline"></div>
      <div id="exec-composer">
        <div id="exec-box">
          <textarea id="exec-input" rows="2" placeholder="直接对执行者说…（空闲=新任务；执行中 Enter=插话，■=中断）"></textarea>
          <div class="exec-controls">
            <span class="spacer"></span>
            <button id="exec-send" class="round-send" title="发送" aria-label="发送">
              <svg class="icon-send" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 12.6V3.6M4.1 7.4 8 3.5l3.9 3.9"/></svg>
              <svg class="icon-stop hidden" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="4.4" y="4.4" width="7.2" height="7.2" rx="1.6" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </aside>
</div>

<div id="modal-mask" class="hidden">
  <div id="modal">
    <h3>设置</h3>
    <div class="section-title">服务商 <span class="hint-inline">凭据全局共享，连一次两个角色都能用</span></div>
    <div id="provider-list"></div>
    <div id="m-result" class="hint"></div>
    <div class="section-title">角色模型</div>
    <div id="role-list"></div>
    <details id="advanced">
      <summary>高级</summary>
      <div class="hint">自定义端点（协议 / 地址 / 手填模型兜底）</div>
      <label>协议
        <select id="adv-protocol">
          <option value="openai">openai 兼容</option>
          <option value="anthropic">anthropic 兼容</option>
        </select>
      </label>
      <label>base_url <input id="adv-base-url" placeholder="留空 = 官方默认（需要 key）"></label>
      <label>API key <input id="adv-key" type="password" autocomplete="off"></label>
      <label>模型（可选，留空自动选）<input id="adv-model"></label>
      <div class="modal-buttons"><button id="adv-connect">连接自定义端点</button></div>
      <div class="hint" id="adv-result"></div>
      <hr class="sep">
      <div class="hint" id="cap-title">模型能力覆盖</div>
      <label>角色
        <select id="cap-role"><option value="main">main</option><option value="executor">executor</option></select>
      </label>
      <label>上下文窗口 <input id="cap-window" placeholder="留空 = 未知（不显示百分比）"></label>
      <label>推理状态
        <select id="cap-mode">
          <option value="unknown">未知</option>
          <option value="fixed">固定开启</option>
          <option value="none">不支持推理</option>
          <option value="adjustable">可调</option>
        </select>
      </label>
      <label>可调强度 <input id="cap-levels" placeholder="如 off,low,medium,high"></label>
      <label>最大输出 <input id="cap-max-output" placeholder="留空 = 未知"></label>
      <label>工具支持
        <select id="cap-tools"><option value="">未知</option><option value="yes">支持</option><option value="no">不支持</option></select>
      </label>
      <div class="hint" id="cap-source"></div>
      <div class="hint" id="cap-help">来源为用户设置时覆盖 provider 返回值；留空的字段表示未知。</div>
      <div class="modal-buttons"><button id="cap-save">保存能力</button><button id="cap-clear">清除覆盖</button></div>
    </details>
    <div class="modal-buttons"><button id="m-close">关闭</button></div>
    <div class="hint" id="m-usage"></div>
  </div>
</div>

<div id="key-modal-mask" class="hidden">
  <div id="key-modal">
    <div class="modal-head">
      <button id="key-back" title="返回">←</button>
      <h3 id="key-title">连接服务商</h3>
      <span class="spacer"></span>
      <button id="key-close" title="关闭">✕</button>
    </div>
    <p class="hint" id="key-desc"></p>
    <label id="key-row"><span>API 密钥</span>
      <input id="key-input" type="password" placeholder="API 密钥" autocomplete="off">
    </label>
    <div class="modal-buttons"><button id="key-submit" class="primary">继续</button></div>
    <div id="key-result"></div>
  </div>
</div>

<div id="model-modal-mask" class="hidden">
  <div id="model-modal">
    <div class="modal-head">
      <h3>选择模型</h3>
      <span class="spacer"></span>
      <button id="mm-refresh" title="从 provider 刷新模型列表">↻ 刷新</button>
      <button id="mm-close">关闭</button>
    </div>
    <input id="mm-search" placeholder="搜索模型 ID 或名称…" autocomplete="off">
    <div id="mm-error" class="fs-error hidden"></div>
    <div id="mm-groups"></div>
    <details id="mm-manual-box">
      <summary>手动输入模型（高级兜底）</summary>
      <div class="modal-foot">
        <select id="mm-manual-provider" title="手动输入所属 provider"></select>
        <input id="mm-manual" placeholder="手动输入模型 ID" autocomplete="off">
        <button id="mm-use-manual">使用</button>
      </div>
    </details>
  </div>
</div>

<div id="modal2-mask" class="hidden">
  <div id="modal2">
    <h3>添加项目</h3>
    <label>名字 <input id="p-name" placeholder="留空用目录名"></label>
    <label>路径 <input id="p-path" placeholder="点选下方目录，或直接输入"></label>
    <div id="dir-browser">
      <div id="dir-current"></div>
      <div id="dir-list"></div>
    </div>
    <div class="modal-buttons">
      <button id="p-pick">选这个目录</button>
      <button id="p-cancel">取消</button>
      <button id="p-ok" class="primary">添加</button>
    </div>
    <div id="p-result"></div>
  </div>
</div>

<script src="/marked.min.js"></script>
<script src="/katex/katex.min.js"></script>
<script src="/katex/contrib/auto-render.min.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
